[project]
name = "beatblock"
version = "0.1.0"
description = "Local AI-assisted chord recommendation: a deterministic music-theory engine proposes candidates, a small local language model ranks them."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.12"
authors = [{ name = "Joshua Ryal Jones" }]
keywords = ["music", "music-theory", "chords", "llm", "slm", "fine-tuning", "dpo"]

dependencies = [
    "typer",
    "rich",
    "pydantic",
    "pyyaml",
    "music21",
]

[project.optional-dependencies]
# Inference and post-training extras. Kept out of the base install so the
# deterministic candidate engine and CI stay lightweight (SPEC.md §27).
ml = [
    "torch",
    "transformers",
    "datasets",
    "accelerate",
    "peft",
    "trl",
]

[project.scripts]
beatblock = "beatblock.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beatblock"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
